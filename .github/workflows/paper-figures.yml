name: Fetch original paper figures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_paper_figures.py'
      - '.github/workflows/paper-figures.yml'
permissions:
  contents: write
concurrency:
  group: paper-figures
  cancel-in-progress: false
jobs:
  extract:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests Pillow PyMuPDF
      - run: python scripts/fetch_paper_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-paper-figures
          path: docs/assets/paper/
      - name: Commit extracted assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/paper README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: archive original AAAI paper result figures'
          git push origin HEAD:main
